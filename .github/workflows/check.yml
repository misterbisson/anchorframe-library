name: check

# Runs on every push and every pull request, including from forks. It needs no
# credentials of any kind — the whole check is Python's standard library over
# files in the repository — so a contributor who cannot be trusted with a secret
# still gets the same green tick as anyone else.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The guards, proven breakable, before the guards are trusted.
      - run: python3 -m unittest discover -s tools -p 'test_*.py' -t tools
      # Then the corpus itself.
      - run: python3 tools/validate.py
      # And that a valid corpus actually builds. `dist/` is not committed; this
      # is the only thing that says the sheets can still be produced.
      - run: python3 tools/build.py
