baseURL = "https://anchorframe.app/library/"
locale = "en-US"
title = "Anchorframe equipment library"
# A robots.txt at a subpath is not read by anything: crawlers fetch it only from
# the origin root, which belongs to anchorframe-site. Emitting one here would be
# a file that looks like it is doing something and is not.
enableRobotsTXT = false

# A mount is the one thing here that cuts across the other three, so it is a
# taxonomy rather than a section: its term page *is* its record, and the page
# that says what a mount is is the same page that lists what fits it.
[taxonomies]
  mount = "mount"

# Publish a photograph only in the size a page actually asks for.
#
# Hugo publishes every page-bundle resource by default, so the 1000px sources
# shipped alongside the derivatives generated from them: 43.9 MB of originals
# nothing links, next to 7.6 MB of WebP the pages use. With this, a resource is
# published only when a template takes its `.RelPermalink` — which the derivative
# has and the source does not.
[cascade.build]
  publishResources = false

[markup.goldmark.renderer]
  unsafe = false

# What each kind is called, in one place. `humanize` pluralises by appending an
# s, which turns "lens" into "Lenss" — it did, twice, in two templates, which is
# what a rule written more than once earns you. English will keep doing this and
# the list is three items long.
[params.kinds]
  camera = "Cameras"
  lens = "Lenses"
  film = "Film stocks"

[params.kindsOne]
  camera = "camera"
  lens = "lens"
  film = "film stock"

[params.kindsMany]
  camera = "cameras"
  lens = "lenses"
  film = "film stocks"

[params]
  license = "CC BY-SA 4.0"
  licenseURL = "https://creativecommons.org/licenses/by-sa/4.0/"
  repo = "https://github.com/misterbisson/anchorframe-library"
